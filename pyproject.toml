[project]
name = "csci576-pipeline"
version = "0.1.0"
description = "CSCI 576 video segmentation pipeline (visual module + player)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "scenedetect[opencv]>=0.6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
player = ["PySide6>=6.5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
